name: APK de lectura

on:
  push:
    tags:
      - apk-lectura-*

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_NO_TYPESCRIPT_SETUP: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_DEMO: '0'
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        run: |
          python3 - <<'PY'
          import os, subprocess
          manager = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([manager, '--licenses'], input='y\n' * 100, text=True, check=True)
          subprocess.run([manager, 'platforms;android-36', 'build-tools;36.0.0', 'ndk;27.1.12297006', 'cmake;3.22.1'], check=True)
          PY
      - name: Instalar dependencias y modelos verificados
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run models -w @lee-conmigo/mobile
      - name: Generar proyecto Android
        run: npm exec --workspace @lee-conmigo/mobile -- expo prebuild --platform android --no-install
      - name: Comprobar ancho nativo de los cuadernos
        run: npm run test:native-layout
      - name: Compilar APK sin servidor
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --console=plain --max-workers=2
      - name: Comprobar y preparar descarga
        run: |
          mkdir -p "$RUNNER_TEMP/kitewise-release"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kitewise-release/Kitewise-lectura.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$RUNNER_TEMP/kitewise-release/Kitewise-lectura.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$RUNNER_TEMP/kitewise-release/Kitewise-lectura.apk"
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          expected = [
              Path('apps/mobile/assets/models') / name
              for name in ['ggml-tiny-q8_0.bin', 'ggml-base-q5_1.bin', 'ggml-silero-v6.2.0.bin']
          ] + [
              Path('apps/reader/public/stories/el-puente-de-las-luciernagas/reader/scene-01.webp'),
              Path('apps/reader/public/stories/mapa-de-la-puerta-desaparecida/reader/letter.webp'),
          ]
          required = {hashlib.sha256(path.read_bytes()).hexdigest() for path in expected}
          apk = Path(os.environ['RUNNER_TEMP']) / 'kitewise-release/Kitewise-lectura.apk'
          with zipfile.ZipFile(apk) as archive:
              found = {hashlib.sha256(archive.read(name)).hexdigest() for name in archive.namelist() if name.endswith(('.bin', '.webp'))}
          assert required <= found, 'El APK no contiene todos los modelos y las ilustraciones esperados'
          PY
          cd "$RUNNER_TEMP/kitewise-release"
          sha256sum Kitewise-lectura.apk > Kitewise-lectura.apk.sha256
          cat > release-notes.md <<'NOTES'
          APK instalable de Kitewise con «El puente de las luciérnagas» y «El mapa de la puerta desaparecida» (Inés y Teo), en español e inglés.

          Conserva la pronunciación y la ayuda al tocar cada palabra. Incluye imágenes por escena, letra ajustable, reanudación, comprensión y repaso.

          Corregida la desaparición visual de los cuadernos en Inicio de Android: las tarjetas conservan su ancho y se distribuyen en filas según la pantalla. Regresión comprobada con el motor Yoga de React Native en seis tamaños de teléfono/tableta.

          Descarga Kitewise-lectura.apk en el teléfono y abre el archivo para instalarlo. Android 7 o posterior. No necesita un servidor de desarrollo. Se adjunta su suma SHA-256.

          Versión para pruebas familiares, firmada con la llave de pruebas existente de Expo; no es una publicación en Google Play. La comprobación audible de TTS y la ergonomía en un dispositivo real siguen pendientes.
          NOTES
          printf '\nCódigo fuente: %s\n' "$GITHUB_SHA" >> release-notes.md
      - name: Publicar descarga en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/kitewise-release"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --title 'Kitewise · Lectura · APK para Android' --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" Kitewise-lectura.apk Kitewise-lectura.apk.sha256
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
